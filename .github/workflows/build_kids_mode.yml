name: Build Smart Kid TV patches

# Run manually from the Actions tab. Produces the .mpp patch bundle as an artifact.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/kids-mode

jobs:
  build:
    name: Build .mpp
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Build Android bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Upload .mpp
        uses: actions/upload-artifact@v7
        with:
          name: smart-kid-tv-patches
          path: patches/build/libs

      - name: Publish release for direct download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="kids-mode-${{ github.run_number }}"
          gh release create "$TAG" patches/build/libs/*.mpp \
            --target "${{ github.sha }}" \
            --title "Smart Kid TV patches #${{ github.run_number }}" \
            --notes "Morphe patches + Kids mode. Thêm file .mpp này vào Morphe Manager làm nguồn patch." \
            --prerelease
